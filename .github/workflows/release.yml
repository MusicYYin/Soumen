name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Soumen/Soumen.csproj'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'Soumen/Soumen.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Project version must be a four-part version. Received: $version"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $path = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile latest.zip -UseBasicParsing
          Expand-Archive -Force latest.zip $path

      - name: Build release
        shell: pwsh
        run: |
          dotnet build Soumen.slnx `
            --configuration Release `
            --nologo `
            -p:Version="$env:RELEASE_VERSION" `
            -p:AssemblyVersion="$env:RELEASE_VERSION" `
            -p:FileVersion="$env:RELEASE_VERSION"

      - name: Archive
        shell: pwsh
        run: |
          $output = "Soumen/bin/x64/Release/Soumen"
          $package = "$output/latest.zip"
          if (-not (Test-Path $package)) {
            throw "Dalamud package latest.zip was not generated."
          }
          Copy-Item $package Soumen.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Soumen ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Soumen.zip
          fail_on_unmatched_files: true

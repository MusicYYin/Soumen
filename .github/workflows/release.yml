name: Release

on:
  push:
    tags:
      - '*.*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release tag must be a four-part version. Received: $version"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $path = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile latest.zip -UseBasicParsing
          Expand-Archive -Force latest.zip $path

      - name: Build release
        shell: pwsh
        run: |
          dotnet build Soumen.slnx `
            --configuration Release `
            --nologo `
            -p:Version="$env:RELEASE_VERSION" `
            -p:AssemblyVersion="$env:RELEASE_VERSION" `
            -p:FileVersion="$env:RELEASE_VERSION"

      - name: Archive
        shell: pwsh
        run: |
          $output = "Soumen/bin/x64/Release/Soumen"
          if (-not (Test-Path "$output/Soumen.dll")) {
            throw "Soumen.dll was not generated."
          }
          Compress-Archive -Path "$output/*" -DestinationPath Soumen.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Soumen ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: Soumen.zip
          fail_on_unmatched_files: true

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $path = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile latest.zip -UseBasicParsing
          Expand-Archive -Force latest.zip $path

      - name: Build
        run: dotnet build Soumen.slnx --configuration Release --nologo

      - name: Store plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soumen
          path: Soumen/bin/x64/Release/Soumen/*
          if-no-files-found: error
          retention-days: 7
